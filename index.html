<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmaLink Lost and Found</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .animate-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Fungsi bantu untuk mendapatkan waktu saat ini (YYYY-MM-DD HH:mm)
        const getNow = () => {
            const now = new Date();
            const date = now.toISOString().split('T')[0];
            const time = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
            return `${date} ${time}`;
        };

        // Komponen Ikon
        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size, display: 'inline-flex', alignItems: 'center' }}></i>;
        };

        function App() {
            const [currentPage, setCurrentPage] = useState('landing');
            const [userInfo, setUserInfo] = useState({ name: '', class: '', absent: '' });
            const [items, setItems] = useState([
                { id: 1, title: "Kunci Motor Honda", description: "Ditemukan di parkiran kantin.", category: "Aksesoris", status: "found", location: "Parkiran", date: "2024-05-20 10:00", reporter: "Budi (XII IPA)", image: "https://images.unsplash.com/photo-1584622650111-993a426fbf0a?w=400" }
            ]);
            const [showModal, setShowModal] = useState(false);
            
            // Form state dengan waktu otomatis
            const [formData, setFormData] = useState({ 
                title: '', 
                description: '', 
                category: 'Lainnya', 
                status: 'found', 
                location: '', 
                date: '' 
            });

            // Set waktu otomatis saat modal dibuka
            useEffect(() => {
                if (showModal) {
                    setFormData(prev => ({ ...prev, date: getNow() }));
                }
            }, [showModal]);

            const handleStart = (e) => {
                e.preventDefault();
                if(userInfo.name) setCurrentPage('dashboard');
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                const newItem = {
                    ...formData,
                    id: Date.now(),
                    reporter: `${userInfo.name} (${userInfo.class})`,
                    image: "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=400"
                };
                setItems([newItem, ...items]);
                setShowModal(false);
                setFormData({ title: '', description: '', category: 'Lainnya', status: 'found', location: '', date: '' });
            };

            if (currentPage === 'landing') {
                return (
                    <div className="min-h-screen bg-indigo-700 flex items-center justify-center p-4">
                        <div className="bg-white w-full max-w-md rounded-[2.5rem] shadow-2xl p-10 animate-in">
                            <div className="text-center mb-8">
                                <div className="bg-yellow-400 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                                    <Icon name="package" size={32} className="text-indigo-900" />
                                </div>
                                <h1 className="text-2xl font-black text-slate-800">SmaLink Lost&Found</h1>
                                <p className="text-slate-500 text-sm">Masuk untuk membantu teman</p>
                            </div>
                            <form onSubmit={handleStart} className="space-y-4">
                                <input required placeholder="Nama Lengkap" className="w-full px-5 py-4 bg-slate-50 rounded-2xl border-2 border-transparent focus:border-indigo-500 outline-none transition-all" onChange={e => setUserInfo({...userInfo, name: e.target.value})} />
                                <div className="grid grid-cols-2 gap-4">
                                    <input required placeholder="Kelas" className="w-full px-5 py-4 bg-slate-50 rounded-2xl border-2 border-transparent focus:border-indigo-500 outline-none transition-all" onChange={e => setUserInfo({...userInfo, class: e.target.value})} />
                                    <input required type="number" placeholder="No Absen" className="w-full px-5 py-4 bg-slate-50 rounded-2xl border-2 border-transparent focus:border-indigo-500 outline-none transition-all" onChange={e => setUserInfo({...userInfo, absent: e.target.value})} />
                                </div>
                                <button className="w-full bg-indigo-600 hover:bg-indigo-800 text-white font-bold py-4 rounded-2xl shadow-lg mt-4 flex items-center justify-center gap-2 transition-all active:scale-95">
                                    Mulai Sekarang <Icon name="arrow-right" />
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-20">
                    <nav className="bg-indigo-700 text-white p-4 sticky top-0 z-50 shadow-md">
                        <div className="max-w-6xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-2">
                                <Icon name="package" className="text-yellow-400" />
                                <span className="font-bold text-xl tracking-tight">SmaLink</span>
                            </div>
                            <div className="flex items-center gap-4">
                                <span className="text-xs opacity-80 hidden sm:block">{userInfo.name} ({userInfo.class})</span>
                                <button onClick={() => setShowModal(true)} className="bg-yellow-400 hover:bg-yellow-500 text-indigo-900 px-5 py-2 rounded-full font-bold flex items-center gap-2 transition-all active:scale-95 shadow-lg">
                                    <Icon name="plus-circle" /> Lapor
                                </button>
                            </div>
                        </div>
                    </nav>

                    <main className="max-w-6xl mx-auto p-4 py-10">
                        <h2 className="text-2xl font-black text-slate-800 mb-8">Barang Terbaru</h2>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                            {items.map(item => (
                                <div key={item.id} className="bg-white rounded-[2.5rem] shadow-sm hover:shadow-xl transition-all overflow-hidden border border-slate-100 group">
                                    <div className="relative">
                                        <img src={item.image} className="w-full h-52 object-cover group-hover:scale-105 transition-transform duration-500" />
                                        <div className={`absolute top-4 left-4 text-[10px] font-bold uppercase px-3 py-1 rounded-full shadow-md ${item.status === 'found' ? 'bg-green-500 text-white' : 'bg-red-500 text-white'}`}>
                                            {item.status === 'found' ? 'Ditemukan' : 'Hilang'}
                                        </div>
                                    </div>
                                    <div className="p-6">
                                        <div className="flex justify-between items-start mb-2">
                                            <span className="text-[10px] font-bold text-indigo-600 bg-indigo-50 px-2 py-1 rounded">{item.category}</span>
                                            <span className="text-[10px] text-slate-400 font-bold uppercase">{item.date}</span>
                                        </div>
                                        <h3 className="font-bold text-lg mb-2 text-slate-800">{item.title}</h3>
                                        <p className="text-slate-500 text-sm mb-6 line-clamp-2 leading-relaxed">{item.description}</p>
                                        <div className="pt-4 border-t border-slate-50 space-y-2">
                                            <div className="text-xs text-slate-600 font-semibold flex items-center gap-2">
                                                <Icon name="map-pin" size={14} className="text-indigo-500" /> {item.location}
                                            </div>
                                            <div className="text-xs text-slate-600 font-semibold flex items-center gap-2">
                                                <Icon name="user" size={14} className="text-indigo-500" /> {item.reporter}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </main>

                    {showModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-[60] animate-in">
                            <div className="bg-white w-full max-w-lg rounded-[2.5rem] p-8 shadow-2xl">
                                <div className="flex justify-between items-center mb-8">
                                    <h2 className="text-2xl font-black text-slate-800">Buat Laporan</h2>
                                    <button onClick={() => setShowModal(false)} className="bg-slate-100 p-2 rounded-full hover:bg-red-50 hover:text-red-500 transition-colors">
                                        <Icon name="x" />
                                    </button>
                                </div>
                                <form onSubmit={handleSubmit} className="space-y-4">
                                    <div className="grid grid-cols-2 gap-3 mb-2">
                                        <button type="button" onClick={() => setFormData({...formData, status: 'found'})} className={`py-3 rounded-2xl font-bold border-2 transition-all ${formData.status === 'found' ? 'bg-green-50 border-green-500 text-green-700' : 'bg-slate-50 border-transparent text-slate-400'}`}>Ditemukan</button>
                                        <button type="button" onClick={() => setFormData({...formData, status: 'lost'})} className={`py-3 rounded-2xl font-bold border-2 transition-all ${formData.status === 'lost' ? 'bg-red-50 border-red-500 text-red-700' : 'bg-slate-50 border-transparent text-slate-400'}`}>Hilang</button>
                                    </div>
                                    <input required placeholder="Nama Barang" className="w-full px-5 py-4 bg-slate-50 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500" value={formData.title} onChange={e => setFormData({...formData, title: e.target.value})} />
                                    <div className="grid grid-cols-2 gap-4">
                                        <input required placeholder="Lokasi" className="w-full px-5 py-4 bg-slate-50 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500" value={formData.location} onChange={e => setFormData({...formData, location: e.target.value})} />
                                        <div className="relative">
                                            <Icon name="calendar" size={16} className="absolute left-4 top-1/2 -translate-y-1/2 text-indigo-500" />
                                            <input required placeholder="Waktu" className="w-full pl-12 pr-5 py-4 bg-indigo-50 rounded-2xl outline-none font-bold text-indigo-700" value={formData.date} onChange={e => setFormData({...formData, date: e.target.value})} />
                                        </div>
                                    </div>
                                    <textarea placeholder="Deskripsi barang (warna, ciri khas, dll)" rows="3" className="w-full px-5 py-4 bg-slate-50 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500 resize-none" value={formData.description} onChange={e => setFormData({...formData, description: e.target.value})}></textarea>
                                    <button className="w-full bg-indigo-600 text-white font-black py-5 rounded-2xl shadow-xl shadow-indigo-200 mt-4 active:scale-95 transition-all">Kirim Laporan</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
